name: Build Native

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native_builds:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            build_args: release win-x64
            build_target: win-x64
            artifact_name: Sakura.Framework.SPIRV/build/Release/win-x64/libsakura-spirv.dll

          - os: windows-latest
            build_args: release win-x86
            build_target: win-x86
            artifact_name: Sakura.Framework.SPIRV/build/Release/win-x86/libsakura-spirv.dll

          - os: windows-latest
            build_args: release win-arm64
            build_target: win-arm64
            artifact_name: Sakura.Framework.SPIRV/build/Release/win-arm64/libsakura-spirv.dll

          # Linux
          - os: ubuntu-22.04
            build_args: release linux-x64
            build_target: linux-x64
            artifact_name: Sakura.Framework.SPIRV/build/Release/linux-x64/libsakura-spirv.so

          - os: ubuntu-22.04-arm
            build_args: release linux-arm64
            build_target: linux-arm64
            artifact_name: Sakura.Framework.SPIRV/build/Release/linux-arm64/libsakura-spirv.so

          # macOS (universal binary: arm64 + x86_64)
          - os: macos-latest
            build_args: release osx 'arm64;x86_64'
            build_target: osx
            artifact_name: Sakura.Framework.SPIRV/build/Release/osx/libsakura-spirv.dylib

          # iOS
          - os: macos-latest
            build_args: release ios
            build_target: ios
            artifact_name: Sakura.Framework.SPIRV/build/Release/ios/sakura-spirv.xcframework.zip

          # Android
          - os: ubuntu-22.04
            build_args: release android arm64-v8a
            build_target: android-arm64-v8a
            artifact_name: Sakura.Framework.SPIRV/build/Release/android-arm64-v8a/libsakura-spirv.so

          - os: ubuntu-22.04
            build_args: release android armeabi-v7a
            build_target: android-armeabi-v7a
            artifact_name: Sakura.Framework.SPIRV/build/Release/android-armeabi-v7a/libsakura-spirv.so

          - os: ubuntu-22.04
            build_args: release android x86_64
            build_target: android-x86_64
            artifact_name: Sakura.Framework.SPIRV/build/Release/android-x86_64/libsakura-spirv.so

          - os: ubuntu-22.04
            build_args: release android x86
            build_target: android-x86
            artifact_name: Sakura.Framework.SPIRV/build/Release/android-x86/libsakura-spirv.so

    name: ${{ matrix.build_target }} Native Build
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set ANDROID_NDK_ROOT
        if: startsWith(matrix.build_target, 'android')
        run: |
          NDK_PATH=$(ls -d ${ANDROID_SDK_ROOT}/ndk/* 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV

      - name: Sync shaderc (Windows)
        working-directory: Sakura.Framework.SPIRV
        shell: cmd
        if: runner.os == 'Windows'
        run: ext\sync-shaderc.cmd

      - name: Sync shaderc (non-Windows)
        working-directory: Sakura.Framework.SPIRV
        shell: bash
        if: runner.os != 'Windows'
        run: bash ext/sync-shaderc.sh

      - name: Build ${{ matrix.build_target }} native library (Windows)
        working-directory: Sakura.Framework.SPIRV
        shell: cmd
        if: runner.os == 'Windows'
        run: build-native.cmd ${{ matrix.build_args }}

      - name: Build ${{ matrix.build_target }} native library (non-Windows)
        working-directory: Sakura.Framework.SPIRV
        shell: bash
        if: runner.os != 'Windows'
        run: bash build-native.sh ${{ matrix.build_args }}

      - name: Check ${{ matrix.build_target }} exports its ABI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # PE exports nothing unless asked. Every entry point here is tagged VD_EXPORT
          # (__declspec(dllexport) on _WIN32), so this passes today -- it is here so that it keeps
          # passing. A new entry point added without the macro, or the macro quietly becoming a no-op,
          # produces a DLL that builds, links, packages and publishes while missing the symbol the
          # managed side P/Invokes, and the only symptom is an EntryPointNotFoundException at runtime
          # on Windows alone. The sibling sakura-audio library shipped exactly that on all three
          # Windows RIDs for months, undetected, because nothing ever asked the artefact what it
          # exports.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            Write-Host "::warning::vswhere not found; skipping the export check."
            exit 0
          }

          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                     Select-Object -First 1

          if (-not $dumpbin) {
            Write-Host "::warning::dumpbin not found; skipping the export check."
            exit 0
          }

          $exports = & $dumpbin.FullName /exports "${{ matrix.artifact_name }}"
          $exports | Write-Host

          # The full managed-facing surface, not just one of them: a header only half-tagged would
          # otherwise pass on whichever symbol happened to be checked.
          foreach ($symbol in @('CompileGlslToSpirv', 'CrossCompile', 'FreeResult')) {
            if (-not ($exports | Select-String -Pattern "\b$symbol\b" -Quiet)) {
              Write-Host "::error::libsakura-spirv.dll does not export $symbol, so the managed side cannot call it."
              exit 1
            }
          }

          Write-Host "All three entry points are exported."

      - name: Compress iOS xcframework for upload
        if: matrix.build_target == 'ios'
        working-directory: Sakura.Framework.SPIRV
        shell: bash
        run: |
          cp -r build/Release/ios/sakura-spirv.xcframework .
          zip -r build/Release/ios/sakura-spirv.xcframework.zip sakura-spirv.xcframework

      - name: Upload ${{ matrix.build_target }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build_target }}
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error

  update_binaries:
    name: Commit Updated Binaries
    runs-on: ubuntu-latest
    needs: native_builds
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Distribute binaries
        run: |
          BASE="Sakura.Framework.SPIRV/build/Release"

          rm -rf "$BASE"
          mkdir -p "$BASE"

          place() {
            local src=$1 rid=$2 filename=$3
            mkdir -p "$BASE/$rid"
            cp "$src" "$BASE/$rid/$filename"
          }

          place artifacts/win-x64/libsakura-spirv.dll win-x64 libsakura-spirv.dll
          place artifacts/win-x86/libsakura-spirv.dll win-x86 libsakura-spirv.dll
          place artifacts/win-arm64/libsakura-spirv.dll win-arm64 libsakura-spirv.dll
          place artifacts/linux-x64/libsakura-spirv.so linux-x64 libsakura-spirv.so
          place artifacts/linux-arm64/libsakura-spirv.so linux-arm64 libsakura-spirv.so
          place artifacts/osx/libsakura-spirv.dylib osx libsakura-spirv.dylib
          place artifacts/android-arm64-v8a/libsakura-spirv.so  android-arm64 libsakura-spirv.so
          place artifacts/android-armeabi-v7a/libsakura-spirv.so android-arm libsakura-spirv.so
          place artifacts/android-x86_64/libsakura-spirv.so android-x64 libsakura-spirv.so
          place artifacts/android-x86/libsakura-spirv.so android-x86 libsakura-spirv.so

          mkdir -p "$BASE/ios"
          unzip -o -qq artifacts/ios/sakura-spirv.xcframework.zip -d "$BASE/ios"

      - name: Commit and push PR branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b update-native-binaries

          git add Sakura.Framework.SPIRV/build/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update native binaries" \
              -m "Co-authored-by: HelloYeew <68165621+HelloYeew@users.noreply.github.com>"
            git push --force origin update-native-binaries
          fi

